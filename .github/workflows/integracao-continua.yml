name: Integração Contínua

on:
  push:
  workflow_dispatch:

jobs:
  #compilar e testar o backend
  backend:
    name: Back-end (compilar e testar)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: condofacil
          POSTGRES_PASSWORD: condofacil
          POSTGRES_DB: condofacil_teste
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U condofacil -d condofacil_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Liberar execução do Maven embutido
        run: chmod +x mvnw

      - name: Compilar e testar
        run: ./mvnw -B verify

  #verificar e testar o react

  frontend:
    name: Front-end (verificar e compilar)
    runs-on: ubuntu-latest

    # Todos os comandos abaixo rodam dentro da pasta frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Verificar o código (lint)
        run: npm run lint

      - name: Compilar
        run: npm run build
