spring.application.name=condofacil


server.port=8080

server.error.include-message=never

server.error.include-stacktrace=never

#banco de dados postgreSQL

spring.datasource.url=${BANCO_URL:jdbc:postgresql://localhost:5432/condofacil}
spring.datasource.username=${BANCO_USUARIO:condofacil}
spring.datasource.password=${BANCO_SENHA:condofacil}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false


# Flyway executa os scripts novos da pasta abaixo

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# sessao de login
# 30min sem usar, expira
server.servlet.session.timeout=30m

server.servlet.session.cookie.http-only=true

server.servlet.session.cookie.same-site=lax
